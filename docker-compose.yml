services:
  redis:
    image: redis:7-alpine
    container_name: skycoach-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    container_name: skycoach-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite+aiosqlite:////app/data/skycoach.db
      - REDIS_URL=redis://redis:6379/0
      - AI_PROVIDER=${AI_PROVIDER:-openrouter}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-qwen/qwen3.8-omni-flash}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - app_data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: skycoach-worker
    restart: unless-stopped
    command: ["rq", "worker", "skycoach_reels", "--url", "redis://redis:6379/0"]
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/skycoach.db
      - REDIS_URL=redis://redis:6379/0
      - AI_PROVIDER=${AI_PROVIDER:-openrouter}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-qwen/qwen3.8-omni-flash}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - app_data:/app/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  app_data:
