# Render free tier: one web service, no Redis, no separate worker.
# The web process works the task queue in memory (QUEUE_BACKEND=memory).
# The free disk is ephemeral: the SQLite database resets on every restart/sleep.
services:
  - type: web
    name: skycoach-reels-analyzer
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: QUEUE_BACKEND
        value: memory
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////app/data/skycoach.db
      - key: AI_PROVIDER
        value: openai_compatible
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENAI_MODEL
        value: qwen/qwen3.8-omni-flash
      # Set in the Render dashboard, never committed
      - key: OPENAI_API_KEY
        sync: false
      # Upload cookies.txt as a Secret File in the dashboard
      - key: YTDLP_COOKIES_FILE
        value: /etc/secrets/cookies.txt
      # Optional: proxy for anonymous YouTube downloads only (Render IPs get
      # YouTube's bot check). Set in the dashboard, e.g. http://host:port
      - key: YOUTUBE_PROXY
        sync: false
